name: build

# Signed release builds for XNota.
# - Tag pushes (v*)  -> full multi-ABI APK + GitHub Release (APK + SHA256SUMS + Arabic notes),
#                      and a Play Store .aab (all ABIs) as a short-lived, auth-guarded artifact.
# - Branch pushes   -> arm64-v8a APK artifact only (saves Actions minutes).
# - Manual dispatch -> same as branch pushes; tick build_aab to also cut the Play .aab.
#
# Signing comes from GitHub Secrets (never stored in the repo):
#   AR_KEYSTORE_BASE64, AR_KEYSTORE_PASSWORD, AR_KEY_ALIAS, AR_KEY_PASSWORD
# The upstream build reads a gitignored keystore.properties; this workflow writes it.
#
# NOTE: the `runner` context is NOT available in job-level env (that made the
# whole file unparseable); it is used at step level only.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      abis:
        description: 'ABIs to build (comma-separated) or "all"'
        required: false
        default: 'arm64-v8a'
      build_aab:
        description: 'Also build the Play Store .aab (all ABIs) as an artifact'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Signed release build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle caches and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install pinned NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Restore signing keystore and write keystore.properties
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/xnota.keystore
          KEYSTORE_BASE64: ${{ secrets.AR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AR_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          {
            echo "storeFile=$KEYSTORE_FILE"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          # keystore.properties is gitignored by upstream; it never enters the repo.

      - name: Resolve ABI set
        id: abis
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "abis=all" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.abis }}" ]]; then
            echo "abis=${{ inputs.abis }}" >> "$GITHUB_OUTPUT"
          else
            echo "abis=arm64-v8a" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests, then release APK
        env:
          ABI_SET: ${{ steps.abis.outputs.abis }}
        run: |
          GRADLE_ARGS=()
          if [[ "$ABI_SET" != "all" ]]; then GRADLE_ARGS+=("-ParAbis=$ABI_SET"); fi
          # The suite first: a red test fails the build before any release is cut.
          ./gradlew :app:testDebugUnitTest assembleRelease --stacktrace --no-daemon "${GRADLE_ARGS[@]}"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Collect APK and checksums
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then VERSION="run${GITHUB_RUN_NUMBER}"; fi
          ABI_SUFFIX=""
          if [[ "${{ steps.abis.outputs.abis }}" != "all" ]]; then
            ABI_SUFFIX="-$(echo '${{ steps.abis.outputs.abis }}' | tr ',+' '-' | tr -d ' ')"
          fi
          APK_BASE="xnota-v${VERSION}${ABI_SUFFIX}"
          cp app/build/outputs/apk/release/*.apk "dist/${APK_BASE}.apk"
          cd dist
          sha256sum "${APK_BASE}.apk" > SHA256SUMS
          cat SHA256SUMS
          echo "APK_BASE=${APK_BASE}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASE }}
          path: dist/
          if-no-files-found: error

      - name: Build Play Store AAB (tag builds, or on request)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_aab)
        # No -ParAbis here on purpose: the bundle always carries every ABI so
        # Play's own split delivery can thin it per device.
        run: ./gradlew :app:bundleRelease --stacktrace --no-daemon

      - name: Collect AAB for the Play artifact
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_aab)
        run: |
          mkdir -p dist-play
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then VERSION="run${GITHUB_RUN_NUMBER}"; fi
          AAB_BASE="xnota-v${VERSION}-play"
          cp app/build/outputs/bundle/release/*.aab "dist-play/${AAB_BASE}.aab"
          cd dist-play
          sha256sum "${AAB_BASE}.aab" > SHA256SUMS
          cat SHA256SUMS
          echo "AAB_BASE=${AAB_BASE}" >> "$GITHUB_ENV"

      # The signed AAB never enters the public repo or its releases — the
      # artifact is auth-guarded and expires in a day, long enough to carry it
      # to the private Play repository.
      - name: Upload AAB artifact (private, 1-day retention)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_aab)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_BASE }}
          path: dist-play/
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: a re-run or a dispatch against the same tag must not
          # fail the job (or clobber a release that is already live).
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — leaving it untouched."
            exit 0
          fi
          NOTES="docs/fork/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$NOTES" ]]; then
            NOTES="$(mktemp -d)/fallback.md"
            {
              echo "# XNota ${GITHUB_REF_NAME}"
              echo
              echo "Private fork build. See the repository for details."
            } > "$NOTES"
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/${APK_BASE}.apk" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "XNota ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES" \
            --latest
