name: screenshots

# Visual verification of the XNota redesign: boots an Android emulator in Arabic (RTL),
# walks the app's key screens, and uploads screenshots as an artifact.
# Manual dispatch any time; also runs on main pushes so the orchestrator can
# download the artifact and verify the design against the reference before tagging.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Emulator screenshots (Arabic RTL)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle caches and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install pinned NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Grant KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger

      - name: Create AVD with a data partition that fits beside the build
        run: |
          # The image's default profile plans a 6G data partition; the runner has ~6G left after
          # the Gradle build, and the runner appends (never replaces) the disk-size line — so the
          # 6G line wins and the emulator dies on its own space check. Create the AVD here and
          # REPLACE the line, then let the runner skip creation and use it as-is.
          # (avdmanager is not on the runner's PATH — it lives in the cmdline-tools.)
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n test --package 'system-images;android-34;default;x86_64'
          sed -i 's/^disk\.dataPartition\.size=.*/disk.dataPartition.size=2G/' "$HOME/.android/avd/test.avd/config.ini"
          grep -n 'disk.dataPartition' "$HOME/.android/avd/test.avd/config.ini"

      - name: Boot emulator, walk the app, capture screens
        # The walkthrough itself is what matters; the runner's emulator teardown can flake
        # (a headless swiftshader guest dying before its own kill), and that must never
        # cost the artifact — the step's outcome is advisory, the upload always runs.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          heap-size: 512M
          ram-size: 4096M
          disk-size: 2G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          emulator-boot-timeout: 1800
          script: |
            set -x
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            cat > /tmp/tap.py <<'PY'
            import re, subprocess, sys
            want = sys.argv[1]
            try:
                xml = open('/tmp/ui.xml', encoding='utf-8').read()
            except OSError:
                sys.exit(1)
            for m in re.finditer(r'<node[^>]*?(?:text|content-desc)="([^"]+)"[^>]*?bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml):
                if want in m.group(1):
                    x = (int(m.group(2)) + int(m.group(4))) // 2
                    y = (int(m.group(3)) + int(m.group(5))) // 2
                    subprocess.run(['adb', 'shell', 'input', 'tap', str(x), str(y)], check=False)
                    sys.exit(0)
            sys.exit(1)
            PY

            # Arabic, RTL — the app's own per-app locale (API 33+), no reboot dance: the app
            # ships generateLocaleConfig, so the locale follows it across every launch after this.
            adb shell cmd locale set-app-locales com.xnota --locales ar || true
            sleep 2

            mkdir -p shots
            shot() { adb exec-out screencap -p > "shots/$1.png"; sleep 1; }

            # Tap by visible label: Compose semantics surface as text/content-desc in the dump.
            tap_text() {
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1 || true
              python3 /tmp/tap.py "$1"
            }

            # 1. First run: the folder picker wears the identity chrome.
            adb shell am start -n com.xnota/.MainActivity
            sleep 10
            shot 01-first-run

            # 2. Internal storage: the home presentation (hero, stats, quick cards, shelf).
            tap_text "تخزين التطبيق" || tap_text "app storage" || true
            sleep 6
            shot 02-home
            adb shell input swipe 540 1700 540 700 400
            sleep 2
            shot 03-home-scrolled

            # 3. The new-note screen (template cards, format chips).
            tap_text "ابدأ دفترا" || tap_text "ابدأ" || true
            sleep 5
            shot 04-new-note

            # 4. Create the note: the writing room (toolbar pill, paper, side panel).
            tap_text "إنشاء" || true
            sleep 8
            shot 05-editor

            # 5. Back to home; open the phone's navigation drawer.
            adb shell input keyevent 4
            sleep 3
            shot 06-back-home
            tap_text "إظهار الشريط" || true
            sleep 3
            shot 07-drawer

            # 6. Preferences (the hub cards), scrolled too.
            tap_text "التفضيلات" || true
            sleep 5
            shot 08-preferences
            adb shell input swipe 540 1500 540 700 400
            sleep 2
            shot 09-preferences-scrolled

            # 7. About: the brand hero, version pill, changelog cards.
            adb shell input keyevent 4
            sleep 3
            tap_text "إظهار الشريط" || true
            sleep 2
            tap_text "حول التطبيق" || tap_text "عن XNota" || true
            sleep 5
            shot 10-about

            ls -la shots/

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: xnota-screenshots
          path: shots/
          if-no-files-found: warn
