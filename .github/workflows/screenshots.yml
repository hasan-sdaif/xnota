name: screenshots

# Visual verification of the XNota redesign: boots an Android emulator in Arabic (RTL),
# walks the app's key screens, and uploads screenshots as an artifact.
# Manual dispatch any time; also runs on main pushes so the orchestrator can
# download the artifact and verify the design against the reference before tagging.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Emulator screenshots (Arabic RTL)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle caches and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install pinned NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Free the runner's disk for the emulator
        # The build leaves the NDK (~2.5G) and CMake behind, and the runner's preinstalled
        # toolchains (dotnet, ghc, boost, docker images) squat on the disk the emulator
        # needs: its userdata-partition space check wants ~7.4G available at the AVD home,
        # and after the build only ~6.2G is left — every boot so far died on that first
        # breath ("Not enough space to create userdata partition"). The emulator needs
        # none of these, and the APK is already built.
        run: |
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" || true
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/.ghcup || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Grant KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger

      - name: Create AVD with a data partition that fits beside the build
        run: |
          # The image's default profile plans a 6G data partition; the runner has ~6G left after
          # the Gradle build, and the runner appends (never replaces) the disk-size line — so the
          # 6G line wins and the emulator dies on its own space check. Create the AVD here and
          # REPLACE the line, then let the runner skip creation and use it as-is.
          # (avdmanager is not on the runner's PATH, and the system image must be installed
          # before the AVD can reference it — both live in the cmdline-tools. The AVD's home
          # follows the tool's own env (ANDROID_USER_HOME and friends), so find the config
          # wherever the tool actually put it.)
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "system-images;android-34;default;x86_64" > /dev/null
          # Pin the AVD home to the runner's own default ($HOME/.android/avd): avdmanager's
          # bare default is the XDG ~/.config/.android path, and the runner — which looks only
          # in its own home — would then re-create the AVD there with the 6G default back.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd --force -n test --package 'system-images;android-34;default;x86_64'
          AVD_INI="$ANDROID_AVD_HOME/test.avd/config.ini"
          test -f "$AVD_INI" || AVD_INI="$(find "$HOME" -path '*test.avd/config.ini' 2>/dev/null | head -1)"
          echo "AVD config: $AVD_INI"
          test -n "$AVD_INI"
          # A '<temp>' data-partition path makes the emulator size a throwaway partition by its
          # own default (6G) and ignore the size line — the FATAL every run died on. Drop the
          # path line so the AVD's own 2G partition is used.
          sed -i -e '/^disk\.dataPartition\.path=<temp>$/d' -e 's/^disk\.dataPartition\.size=.*/disk.dataPartition.size=2G/' "$AVD_INI"
          # A phone-sized 1080x2160 @480dpi panel: the default postage-stamp 320x640 makes the
          # captures unreadable and the walkthrough's coordinates out of bounds.
          printf 'hw.lcd.density=480\nhw.lcd.width=1080\nhw.lcd.height=2160\n' >> "$AVD_INI"
          grep -n -e 'disk.dataPartition' -e 'hw.lcd' "$AVD_INI"

      - name: Boot emulator, walk the app, capture screens
        # The walkthrough itself is what matters; the runner's emulator teardown can flake
        # (a headless swiftshader guest dying before its own kill), and that must never
        # cost the artifact — the step's outcome is advisory, the upload always runs.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          heap-size: 512M
          ram-size: 4096M
          disk-size: 2G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          emulator-boot-timeout: 1800
          script: |
            set -x
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            # The tap helper, base64'd whole: the runner executes this script LINE BY LINE, so a
            # heredoc can never survive (each line becomes its own sh -c — the heredoc's body
            # ran as commands and died on 'import: not found').
            echo '' | base64 -d > /tmp/tap.py

            # Arabic, RTL — the app's own per-app locale (API 33+), no reboot dance.
            adb shell cmd locale set-app-locales com.xnota.debug --locales ar || true

            mkdir -p shots

            # 1. First run: the folder picker wears the identity chrome.
            adb shell am start -n com.xnota.debug/com.xnota.MainActivity; sleep 12; adb exec-out screencap -p > shots/01-first-run.png; sleep 1

            # 2. Internal storage: the home presentation.
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1; python3 /tmp/tap.py 'تخزين التطبيق' || python3 /tmp/tap.py 'app storage' || true
            sleep 6; adb exec-out screencap -p > shots/02-home.png; sleep 1

            # 3. The home, scrolled to the shelf.
            adb shell input swipe 540 1700 540 700 400; sleep 2; adb exec-out screencap -p > shots/03-home-scrolled.png; sleep 1

            # 4. The new-note screen: the hero's start, the quick card, or the create button.
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1; python3 /tmp/tap.py 'ابدأ دفترا' || python3 /tmp/tap.py 'ملاحظة جديدة' || python3 /tmp/tap.py 'إنشاء' || true
            sleep 5; adb exec-out screencap -p > shots/04-new-note.png; sleep 1

            # 5. Create the note: the writing room.
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1; python3 /tmp/tap.py 'إنشاء' || true
            sleep 8; adb exec-out screencap -p > shots/05-editor.png; sleep 1

            # 6. Back to home, then the navigation drawer from the right edge.
            adb shell input keyevent 4; sleep 3; adb exec-out screencap -p > shots/06-back-home.png; sleep 1
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1; python3 /tmp/tap.py 'إظهار الشريط' || true
            sleep 3; adb exec-out screencap -p > shots/07-drawer.png; sleep 1

            # 7. Preferences: the hub cards.
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1; python3 /tmp/tap.py 'التفضيلات' || true
            sleep 5; adb exec-out screencap -p > shots/08-preferences.png; sleep 1

            # 8. Preferences, scrolled.
            adb shell input swipe 540 1500 540 700 400; sleep 2; adb exec-out screencap -p > shots/09-preferences-scrolled.png; sleep 1

            # 9. About: the brand lockup, version pill, changelog cards.
            adb shell input keyevent 4; sleep 3; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1; python3 /tmp/tap.py 'إظهار الشريط' || true
            sleep 2; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1; python3 /tmp/tap.py 'حول التطبيق' || python3 /tmp/tap.py 'عن XNota' || true
            sleep 5; adb exec-out screencap -p > shots/10-about.png; sleep 1

            ls -la shots/

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: xnota-screenshots
          path: shots/
          # An empty shots/ means the emulator never booted and the walkthrough never
          # ran — that must fail the workflow, not pass it hollow. A teardown flake
          # still leaves the shots on disk, so the artifact survives exactly as before.
          if-no-files-found: error
